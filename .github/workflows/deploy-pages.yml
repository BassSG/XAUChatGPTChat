name: Deploy XAU Desk to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run desk regression tests
        run: npm test
      - name: Install Worker test dependencies
        run: npm ci --prefix worker
      - name: Run Worker and release validation
        run: npm run test:manual && npm run test:release
      - name: Build site
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.XAU_WORKER_URL }}
      - name: Check for a new analysis report
        id: report-change
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || git diff-tree --root --no-commit-id --name-only -r "$GITHUB_SHA" | grep -qE '^public/reports/latest(\.json|\.png)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate analysis before deployment
        if: steps.report-change.outputs.changed == 'true' && !contains(github.event.head_commit.message, '[skip notify]')
        run: node scripts/validate-report.mjs --publish --input public/reports/latest.json --image public/reports/latest.png
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Publish the report and send mobile alerts
        if: steps.report-change.outputs.changed == 'true' && !contains(github.event.head_commit.message, '[skip notify]')
        env:
          WORKER_URL: ${{ vars.XAU_WORKER_URL }}
          REPORT_TOKEN: ${{ secrets.XAU_REPORT_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          if (!process.env.WORKER_URL || !process.env.REPORT_TOKEN) {
            throw new Error("XAU_WORKER_URL and XAU_REPORT_TOKEN must be configured.");
          }

          const report = JSON.parse(await readFile("public/reports/latest.json", "utf8"));
          if (!report.snapshotAt) {
            console.log("No generated analysis yet; skipping.");
            process.exit(0);
          }

          const response = await fetch(process.env.WORKER_URL.replace(/\/$/, "") + "/api/admin/reports", {
            method: "POST",
            headers: {
              "Authorization": "Bearer " + process.env.REPORT_TOKEN,
              "Content-Type": "application/json"
            },
            body: JSON.stringify(report)
          });
          const result = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error("Report publish failed with HTTP " + response.status + ": " + (result.error || "unknown error"));
          console.log(JSON.stringify(result));
          NODE
