name: Publish analysis to XAU Desk

on:
  push:
    branches: [main]
    paths:
      - "public/reports/latest.json"
      - "public/reports/latest.png"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the latest brief
        uses: actions/checkout@v4
      - name: Send report to the Worker
        env:
          WORKER_URL: ${{ vars.XAU_WORKER_URL }}
          REPORT_TOKEN: ${{ secrets.XAU_REPORT_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          if (!process.env.WORKER_URL || !process.env.REPORT_TOKEN) {
            throw new Error("XAU_WORKER_URL and XAU_REPORT_TOKEN must be configured.");
          }

          const report = JSON.parse(await readFile("public/reports/latest.json", "utf8"));
          if (!report.snapshotAt) {
            console.log("No generated analysis yet; skipping.");
            process.exit(0);
          }
          const response = await fetch(process.env.WORKER_URL.replace(/\/$/, "") + "/api/admin/reports", {
            method: "POST",
            headers: {
              "Authorization": "Bearer " + process.env.REPORT_TOKEN,
              "Content-Type": "application/json"
            },
            body: JSON.stringify(report)
          });
          const result = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error("Report publish failed with HTTP " + response.status + ": " + (result.error || "unknown error"));
          console.log(JSON.stringify(result));
          NODE

